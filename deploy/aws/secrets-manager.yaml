AWSTemplateFormatVersion: '2010-09-09'
Description: Generate isolated Jogos Web secrets for one deployment environment.

Parameters:
  ProjectName:
    Type: String
    Default: jogos
    AllowedPattern: '[a-zA-Z0-9/_+=.@-]+'
  Environment:
    Type: String
    AllowedValues:
      - dev
      - homologacao
      - prod

Resources:
  PostgresAdminPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/postgres/admin-password'
      Description: !Sub 'PostgreSQL administrator password for ${ProjectName}/${Environment}'
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  UserDatabasePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/user-service/database-password'
      Description: !Sub 'User Service database password for ${ProjectName}/${Environment}'
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  UserJwtSigningKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/user-service/jwt-signing-key'
      Description: !Sub 'JWT signing key for ${ProjectName}/${Environment}'
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  GameDatabasePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/game-service/database-password'
      Description: !Sub 'Game Service database password for ${ProjectName}/${Environment}'
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  RankDatabasePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/rank-service/database-password'
      Description: !Sub 'Rank Service database password for ${ProjectName}/${Environment}'
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  RecoveryTokenSigningKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/recovery-service/token-signing-key'
      Description: !Sub 'Recovery token signing key for ${ProjectName}/${Environment}'
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

Outputs:
  PostgresAdminPasswordArn:
    Value: !Ref PostgresAdminPassword
  UserDatabasePasswordArn:
    Value: !Ref UserDatabasePassword
  UserJwtSigningKeyArn:
    Value: !Ref UserJwtSigningKey
  GameDatabasePasswordArn:
    Value: !Ref GameDatabasePassword
  RankDatabasePasswordArn:
    Value: !Ref RankDatabasePassword
  RecoveryTokenSigningKeyArn:
    Value: !Ref RecoveryTokenSigningKey
