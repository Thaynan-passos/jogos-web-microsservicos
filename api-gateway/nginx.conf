events {}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/user/ {
            proxy_pass http://user-service:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/game/ {
            proxy_pass http://game-service:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/rank/ {
            proxy_pass http://rank-service:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/recovery/ {
            proxy_pass http://recovery-service:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
