services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      USER_SERVICE_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD:?Configure USER_SERVICE_DB_PASSWORD in .env}
      GAME_SERVICE_DB_PASSWORD: ${GAME_SERVICE_DB_PASSWORD:?Configure GAME_SERVICE_DB_PASSWORD in .env}
      RANK_SERVICE_DB_PASSWORD: ${RANK_SERVICE_DB_PASSWORD:?Configure RANK_SERVICE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/schemas:/database/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./services/user-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD:?Configure USER_SERVICE_DB_PASSWORD in .env}
      POSTGRES_DB: user_service
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${USER_SERVICE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rank-service:
    build:
      context: ./services/rank-service
    restart: unless-stopped
    ports:
      - "${RANK_SERVICE_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  recovery-service:
    build:
      context: ./services/recovery-service
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      USER_SERVICE_URL: http://user-service:8000
    depends_on:
      user-service:
        condition: service_healthy
    ports:
      - "${RECOVERY_SERVICE_PORT:-8004}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
