services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    networks:
      - edge
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
      - backend
    depends_on:
      user-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      rank-service:
        condition: service_healthy
      recovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      USER_SERVICE_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD:?Configure USER_SERVICE_DB_PASSWORD in .env}
      GAME_SERVICE_DB_PASSWORD: ${GAME_SERVICE_DB_PASSWORD:?Configure GAME_SERVICE_DB_PASSWORD in .env}
      RANK_SERVICE_DB_PASSWORD: ${RANK_SERVICE_DB_PASSWORD:?Configure RANK_SERVICE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/schemas:/database/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres && test \"$$(psql -U \"$${POSTGRES_USER}\" -d postgres -qtAX -c \"SELECT to_regclass('public.compose_bootstrap_status')\")\" = \"compose_bootstrap_status\" && psql -U \"$${POSTGRES_USER}\" -d postgres -qtAX -c \"SELECT 1 FROM compose_bootstrap_status WHERE id = 1\" | grep -q '^1$'"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: ./services/user-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD:?Configure USER_SERVICE_DB_PASSWORD in .env}
      POSTGRES_DB: user_service
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      RECOVERY_SERVICE_SECRET: ${RECOVERY_SERVICE_SECRET:?Configure RECOVERY_SERVICE_SECRET in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rank-service:
    build:
      context: ./services/rank-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      POSTGRES_USER: rank_service
      POSTGRES_PASSWORD: ${RANK_SERVICE_DB_PASSWORD:?Configure RANK_SERVICE_DB_PASSWORD in .env}
      POSTGRES_DB: rank_service
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      USER_SERVICE_URL: http://user-service:8000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  game-service:
    build:
      context: ./services/game-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      POSTGRES_USER: game_service
      POSTGRES_PASSWORD: ${GAME_SERVICE_DB_PASSWORD:?Configure GAME_SERVICE_DB_PASSWORD in .env}
      POSTGRES_DB: game_service
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      USER_SERVICE_URL: http://user-service:8000
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  recovery-service:
    build:
      context: ./services/recovery-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      RECOVERY_TOKEN_SECRET_KEY: ${RECOVERY_TOKEN_SECRET_KEY:?Configure RECOVERY_TOKEN_SECRET_KEY in .env}
      USER_SERVICE_SHARED_SECRET: ${RECOVERY_SERVICE_SECRET:?Configure RECOVERY_SERVICE_SECRET in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      USER_SERVICE_URL: http://user-service:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    networks:
      - backend
      - egress
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

networks:
  edge:
  backend:
    internal: true
  egress:
